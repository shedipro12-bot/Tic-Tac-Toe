<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#173E35" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-180.png" />
    <meta name="description" content="Choose a challenge and play Tic-Tac-Toe against the computer." />
    <title>Tic-Tac-Toe</title>
  </head>
  <body>
    <div id="root"></div>
    <main id="connection-needed" class="connection-shell" hidden>
      <header><h1>Tic-Tac-Toe</h1></header>
      <section class="connection-copy"><h2 id="connection-title" tabindex="-1">Connection needed</h2>
        <p>Connect to the internet to load the game.</p></section>
      <section id="bootstrap-update" class="connection-update" aria-label="Application update" hidden>
        <p id="bootstrap-update-message" aria-live="polite">A new version is ready.</p>
        <button id="bootstrap-update-button" type="button">Update and reset session</button>
      </section>
    </main>
    <script type="module" src="/src/boot.ts"></script>
  </body>
</html>
